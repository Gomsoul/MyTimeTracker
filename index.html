<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>마이 트래커</title>

  <!-- PWA -->
  <link rel="manifest" href="/MyTimeTracker/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="마이 트래커" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Firebase 8.10.1 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #eef0f8;
      --white: #ffffff;
      --nav-shadow: 0 2px 12px rgba(100,100,180,0.08);
      --card-shadow: 0 4px 20px rgba(100,100,180,0.10);
      --card-radius: 16px;
      --tab-bg: #ede9f8;
      --accent: #7c6fcf;
      --text-main: #2d2d4e;
      --text-sub: #8888aa;
      --gradient-start: #6c8ef5;
      --gradient-end: #9b7fe8;

      --pink:    #F9A8B8;
      --peach:   #FDD9B5;
      --mint:    #B8EAC8;
      --skyblue: #C8E4F8;
      --lilac:   #E8B8F0;
      --lavender:#D4C8F0;
      --blue:    #A8D8F8;
      --beige:   #E8E0D0;
      --blush:   #F8C8C8;
      --silver:  #D0D4D8;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--white);
      box-shadow: var(--nav-shadow);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px;
      height: 60px;
    }
    .nav-title {
      font-size: 1.15rem; font-weight: 800; color: var(--text-main);
      display: flex; align-items: center; gap: 6px;
    }
    .tab-group {
      display: flex; align-items: center;
      background: var(--tab-bg);
      border-radius: 12px; padding: 4px; gap: 2px;
    }
    .tab-btn {
      border: none; cursor: pointer; font-family: 'Nunito', sans-serif;
      font-size: 0.85rem; font-weight: 700;
      padding: 6px 18px; border-radius: 9px;
      background: transparent; color: var(--accent);
      transition: background 0.18s, box-shadow 0.18s, color 0.18s;
    }
    .tab-btn.active {
      background: var(--white);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(100,100,180,0.13);
    }

    /* ── MAIN CONTENT ── */
    main { max-width: 600px; margin: 0 auto; padding: 24px 16px 60px; }

    /* ── TODAY TOTAL CARD ── */
    .total-card {
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      border-radius: var(--card-radius);
      padding: 24px 28px;
      color: var(--white);
      margin-bottom: 20px;
      box-shadow: 0 8px 28px rgba(108,142,245,0.28);
    }
    .total-card .label {
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em;
      opacity: 0.85; margin-bottom: 6px; text-transform: uppercase;
    }
    .total-card .time-big {
      font-size: 2.4rem; font-weight: 900; letter-spacing: -0.02em;
    }
    .total-card .sub { font-size: 0.82rem; opacity: 0.75; margin-top: 4px; }

    /* ── ADD GOAL ── */
    .add-row {
      display: flex; gap: 8px; margin-bottom: 20px;
    }
    .add-input {
      flex: 1; border: 2px solid #d8d8ee; border-radius: 12px;
      padding: 10px 16px; font-family: 'Nunito', sans-serif;
      font-size: 0.95rem; font-weight: 600; color: var(--text-main);
      background: var(--white); outline: none;
      transition: border-color 0.18s;
    }
    .add-input:focus { border-color: var(--accent); }
    .add-input::placeholder { color: var(--text-sub); font-weight: 500; }
    .add-btn {
      border: none; cursor: pointer; border-radius: 12px;
      background: var(--accent); color: var(--white);
      font-family: 'Nunito', sans-serif; font-weight: 800;
      font-size: 1.2rem; padding: 0 18px;
      transition: transform 0.12s, opacity 0.12s;
    }
    .add-btn:active { transform: scale(0.95); opacity: 0.9; }

    /* ── GOAL CARDS ── */
    .goal-list { display: flex; flex-direction: column; gap: 10px; }
    .goal-card {
      background: var(--white);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      display: flex; align-items: center;
      overflow: hidden;
      transition: transform 0.15s;
    }
    .goal-card:active { transform: scale(0.99); }
    .goal-color-bar {
      width: 5px; align-self: stretch; flex-shrink: 0;
    }
    .goal-body {
      flex: 1; padding: 14px 12px;
      display: flex; align-items: center; gap: 10px; min-width: 0;
    }
    .goal-info { flex: 1; min-width: 0; }
    .goal-name {
      font-size: 0.95rem; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .goal-time {
      font-size: 0.82rem; font-weight: 600; color: var(--text-sub);
      margin-top: 2px; font-variant-numeric: tabular-nums;
    }
    .goal-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .icon-btn {
      border: none; cursor: pointer; background: none;
      width: 34px; height: 34px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; transition: background 0.15s;
      color: var(--text-sub);
    }
    .icon-btn:hover { background: var(--bg); }
    .play-btn {
      width: 38px; height: 38px; border-radius: 12px;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 800;
      transition: transform 0.12s, filter 0.15s;
      flex-shrink: 0;
    }
    .play-btn:active { transform: scale(0.92); }
    .play-btn.running { filter: brightness(0.88); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center; padding: 48px 16px;
      color: var(--text-sub); font-size: 0.9rem; font-weight: 600;
    }
    .empty-state .emoji { font-size: 2.4rem; margin-bottom: 12px; }

    /* ── MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(45,45,78,0.35); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--white); border-radius: 20px;
      padding: 28px 24px; width: 100%; max-width: 380px;
      box-shadow: 0 20px 60px rgba(100,100,180,0.22);
      animation: modalIn 0.22s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes modalIn {
      from { transform: scale(0.88) translateY(12px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }
    .modal-title {
      font-size: 1.05rem; font-weight: 800; color: var(--text-main);
      margin-bottom: 4px;
    }
    .modal-desc {
      font-size: 0.8rem; color: var(--text-sub); font-weight: 500;
      margin-bottom: 20px; line-height: 1.5;
    }
    .modal-field { margin-bottom: 14px; }
    .modal-field label {
      display: block; font-size: 0.78rem; font-weight: 700;
      color: var(--text-sub); margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase;
    }
    .modal-input {
      width: 100%; border: 2px solid #d8d8ee; border-radius: 12px;
      padding: 10px 14px; font-family: 'Nunito', sans-serif;
      font-size: 0.95rem; font-weight: 600; color: var(--text-main);
      background: var(--white); outline: none;
      transition: border-color 0.18s;
    }
    .modal-input:focus { border-color: var(--accent); }
    .modal-input[type="date"] {
      display: block;
      width: 100%;
      max-width: 100%;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
    .btn-cancel {
      flex: 1; border: 2px solid #d8d8ee; background: none;
      border-radius: 12px; padding: 10px;
      font-family: 'Nunito', sans-serif; font-weight: 700;
      font-size: 0.9rem; color: var(--text-sub); cursor: pointer;
      transition: border-color 0.15s;
    }
    .btn-cancel:hover { border-color: #b8b8cc; }
    .btn-save {
      flex: 2; border: none; background: var(--accent);
      border-radius: 12px; padding: 10px;
      font-family: 'Nunito', sans-serif; font-weight: 800;
      font-size: 0.9rem; color: var(--white); cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-save:hover { opacity: 0.88; }

    /* ── EDIT MODAL ── */
    #editModal .modal-title { margin-bottom: 16px; }

    /* ── REPORT TAB ── */
    .report-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; gap: 8px; flex-wrap: wrap;
    }
    .period-group {
      display: flex; background: var(--tab-bg); border-radius: 10px; padding: 3px; gap: 2px;
    }
    .period-btn {
      border: none; cursor: pointer; font-family: 'Nunito', sans-serif;
      font-size: 0.82rem; font-weight: 700; padding: 5px 14px;
      border-radius: 8px; background: transparent; color: var(--accent);
      transition: background 0.15s, box-shadow 0.15s;
    }
    .period-btn.active {
      background: var(--white); color: var(--text-main);
      box-shadow: 0 2px 8px rgba(100,100,180,0.12);
    }
    .nav-arrows { display: flex; align-items: center; gap: 6px; }
    .arrow-btn {
      border: none; background: var(--white); cursor: pointer;
      border-radius: 9px; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: var(--text-sub);
      box-shadow: 0 2px 8px rgba(100,100,180,0.10);
      transition: background 0.15s;
    }
    .arrow-btn:hover { background: var(--bg); }
    .period-label {
      font-size: 0.85rem; font-weight: 700; color: var(--text-main);
      white-space: nowrap;
    }
    .stat-row {
      display: flex; gap: 10px; margin-bottom: 20px;
    }
    .stat-card {
      flex: 1; background: var(--white); border-radius: var(--card-radius);
      padding: 16px 18px; box-shadow: var(--card-shadow);
    }
    .stat-card .s-label {
      font-size: 0.72rem; font-weight: 700; color: var(--text-sub);
      letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px;
    }
    .stat-card .s-value {
      font-size: 1.35rem; font-weight: 900; color: var(--text-main);
    }
    .chart-card {
      background: var(--white); border-radius: var(--card-radius);
      padding: 20px; box-shadow: var(--card-shadow); margin-bottom: 16px;
    }
    .chart-card canvas { max-height: 220px; }
    .breakdown-list { display: flex; flex-direction: column; gap: 10px; }
    .breakdown-item {
      background: var(--white); border-radius: var(--card-radius);
      padding: 14px 16px; box-shadow: var(--card-shadow);
    }
    .breakdown-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .breakdown-name { font-size: 0.9rem; font-weight: 700; }
    .breakdown-time { font-size: 0.85rem; font-weight: 600; color: var(--text-sub); }
    .progress-track {
      height: 8px; border-radius: 99px; background: var(--bg); overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 99px;
      transition: width 0.5s cubic-bezier(0.34,1.2,0.64,1);
    }

    /* ── LOADING ── */
    .loading-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: var(--bg); display: flex;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
    }
    .loading-spinner {
      width: 40px; height: 40px; border: 4px solid #e0dcf8;
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.9rem; font-weight: 600; color: var(--text-sub); }

    @media (max-width: 380px) {
      nav { padding: 0 12px; }
      .tab-btn { padding: 6px 12px; font-size: 0.8rem; }
      main { padding: 16px 10px 60px; }
      .total-card .time-big { font-size: 2rem; }
    }
  </style>
</head>
<body>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">불러오는 중...</div>
</div>

<!-- Nav -->
<nav>
  <div class="nav-title">⏱ 마이 트래커</div>
  <div class="tab-group">
    <button class="tab-btn" id="tabTrackerBtn" onclick="showTab('tracker')">트래커</button>
    <button class="tab-btn" id="tabReportBtn" onclick="showTab('report')">리포트</button>
  </div>
</nav>

<main>
  <!-- TRACKER TAB -->
  <div id="trackerPanel" style="display:none">
    <!-- Today Total -->
    <div class="total-card">
      <div class="label">TODAY TOTAL</div>
      <div class="time-big" id="todayTotal">0분 00초</div>
      <div class="sub" id="todayDate">오늘</div>
    </div>

    <!-- Add Goal -->
    <div class="add-row">
      <input class="add-input" id="goalInput" placeholder="새 목표 입력..." maxlength="40" />
      <button class="add-btn" onclick="addGoal()">＋</button>
    </div>

    <!-- Goal List -->
    <div class="goal-list" id="goalList">
      <div class="empty-state">
        <div class="emoji">🎯</div>
        <div>목표를 추가해보세요!</div>
      </div>
    </div>
  </div>

  <!-- REPORT TAB -->
  <div id="reportPanel" style="display:none">
    <div class="report-header">
      <div class="period-group">
        <button class="period-btn active" id="weekBtn" onclick="setPeriod('week')">주간</button>
        <button class="period-btn" id="monthBtn" onclick="setPeriod('month')">월간</button>
      </div>
      <div class="nav-arrows">
        <button class="arrow-btn" onclick="movePeriod(-1)">‹</button>
        <span class="period-label" id="periodLabel"></span>
        <button class="arrow-btn" onclick="movePeriod(1)">›</button>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat-card">
        <div class="s-label">총합</div>
        <div class="s-value" id="reportTotal">0분</div>
      </div>
      <div class="stat-card">
        <div class="s-label">하루 평균</div>
        <div class="s-value" id="reportAvg">0분</div>
      </div>
    </div>
    <div class="chart-card">
      <canvas id="reportChart"></canvas>
    </div>
    <div class="breakdown-list" id="breakdownList"></div>
  </div>
</main>

<!-- Time Add Modal -->
<div class="modal-overlay" id="timeModal">
  <div class="modal">
    <div class="modal-title" id="timeModalTitle">시간 추가</div>
    <div class="modal-desc">스탑워치로 재지 않은 시간을 추가합니다.</div>
    <div class="modal-field">
      <label>날짜</label>
      <input class="modal-input" type="date" id="timeModalDate" />
    </div>
    <div class="modal-field">
      <label>추가할 시간 (분)</label>
      <input class="modal-input" type="number" id="timeModalMins" placeholder="분 입력" min="1" max="1440" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeTimeModal()">취소</button>
      <button class="btn-save" onclick="saveTimeModal()">저장</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-title">목표 수정</div>
    <div class="modal-field">
      <label>목표 이름</label>
      <input class="modal-input" id="editInput" maxlength="40" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeEditModal()">취소</button>
      <button class="btn-save" onclick="saveEditModal()">저장</button>
    </div>
  </div>
</div>

<script>
// ── FIREBASE INIT ──
const firebaseConfig = {
  apiKey: "AIzaSyBZiXaYf0Ns_zNNuN2cnStr-BUDrkA0afs",
  authDomain: "mytimetracker-eae2d.firebaseapp.com",
  projectId: "mytimetracker-eae2d",
  storageBucket: "mytimetracker-eae2d.firebasestorage.app",
  messagingSenderId: "517418710325",
  appId: "1:517418710325:web:d19bbdd1eb9363a038c87c"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ── COLORS ──
const COLORS = {
  pink:    '#F9A8B8', peach:   '#FDD9B5', mint:    '#B8EAC8',
  skyblue: '#C8E4F8', lilac:   '#E8B8F0', lavender:'#D4C8F0',
  blue:    '#A8D8F8', beige:   '#E8E0D0', blush:   '#F8C8C8', silver:  '#D0D4D8'
};
const COLOR_KEYS = Object.keys(COLORS);
function randomColorId() { return COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)]; }
function colorFromId(id) {
  if (!id) return '#D4C8F0';
  let h = 0; for (let c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return COLORS[COLOR_KEYS[h % COLOR_KEYS.length]];
}
function getColor(task) {
  return task.colorId ? (COLORS[task.colorId] || colorFromId(task.id)) : colorFromId(task.id);
}

// ── STATE ──
let uid = null;
let tasks = [];       // [{id, name, colorId, createdAt}]
let todayLogs = {};   // {taskId: seconds}
let allLogs = {};     // {'YYYY-MM-DD': {taskId: seconds}}
let runningId = null;
let runningStart = null;
let timerInterval = null;
let taskUnsub = null;
let logUnsubMap = {};

let timeModalTaskId = null;
let editModalTaskId = null;

let reportPeriod = 'week';
let reportOffset = 0;
let reportChart = null;

// ── DATE HELPERS ──
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function secsToHM(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h > 0) return `${h}시간 ${m}분`;
  return `${m}분`;
}
function secsToMS(s) {
  return `${Math.floor(s/60)}분 ${String(s%60).padStart(2,'0')}초`;
}
function dateKo(d) {
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`;
}

// ── TAB ──
function showTab(tab) {
  var tracker = document.getElementById('trackerPanel');
  var report  = document.getElementById('reportPanel');
  var tBtn    = document.getElementById('tabTrackerBtn');
  var rBtn    = document.getElementById('tabReportBtn');

  // 명시적으로 둘 다 숨기고 하나만 표시
  tracker.style.display = 'none';
  report.style.display  = 'none';
  tBtn.classList.remove('active');
  rBtn.classList.remove('active');

  if (tab === 'tracker') {
    tracker.style.display = 'block';
    tBtn.classList.add('active');
  } else {
    report.style.display = 'block';
    rBtn.classList.add('active');
    renderReport();
  }
}

// ── AUTH & LOAD ──
auth.signInAnonymously().catch(console.error);
auth.onAuthStateChanged(user => {
  if (!user) return;
  uid = user.uid;
  loadTasks();
  document.getElementById('todayDate').textContent = dateKo(new Date());
});

function tasksRef()       { return db.collection('users').doc(uid).collection('tasks'); }
function logsRef(dateStr) { return db.collection('users').doc(uid).collection('logs').doc(dateStr); }

function loadTasks() {
  if (taskUnsub) taskUnsub();
  taskUnsub = tasksRef().orderBy('createdAt').onSnapshot(snap => {
    tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    subscribeLog(todayStr());
    renderGoals();
    document.getElementById('loadingOverlay').style.display = 'none';
  });
}

function subscribeLog(dateStr) {
  if (logUnsubMap[dateStr]) return;
  logUnsubMap[dateStr] = logsRef(dateStr).onSnapshot(snap => {
    const data = snap.exists ? snap.data() : {};
    if (dateStr === todayStr()) {
      todayLogs = data;
      renderGoals();
    }
    allLogs[dateStr] = data;
  });
}

// ── GOAL CRUD ──
async function addGoal() {
  const inp = document.getElementById('goalInput');
  const name = inp.value.trim();
  if (!name || !uid) return;
  inp.value = '';
  const colorId = randomColorId();
  await tasksRef().add({ name, colorId, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
}

document.getElementById('goalInput').addEventListener('keydown', e => { if (e.key === 'Enter') addGoal(); });

async function deleteGoal(id) {
  if (!confirm('정말 삭제할까요?')) return;
  if (runningId === id) stopTimer();
  await tasksRef().doc(id).delete();
}

// ── EDIT MODAL ──
function openEditModal(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  editModalTaskId = id;
  document.getElementById('editInput').value = t.name;
  document.getElementById('editModal').classList.add('open');
  setTimeout(() => document.getElementById('editInput').focus(), 80);
}
function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
  editModalTaskId = null;
}
async function saveEditModal() {
  const name = document.getElementById('editInput').value.trim();
  if (!name || !editModalTaskId) return;
  await tasksRef().doc(editModalTaskId).update({ name });
  closeEditModal();
}
document.getElementById('editInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveEditModal(); });
document.getElementById('editModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeEditModal(); });

// ── TIME ADD MODAL ──
function openTimeModal(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  timeModalTaskId = id;
  document.getElementById('timeModalTitle').textContent = `[${t.name}] 시간 추가`;
  document.getElementById('timeModalDate').value = todayStr();
  document.getElementById('timeModalMins').value = '';
  document.getElementById('timeModal').classList.add('open');
  setTimeout(() => document.getElementById('timeModalMins').focus(), 80);
}
function closeTimeModal() {
  document.getElementById('timeModal').classList.remove('open');
  timeModalTaskId = null;
}
document.getElementById('timeModalMins').addEventListener('click', function() { this.select(); });
document.getElementById('timeModalMins').addEventListener('keydown', e => { if (e.key === 'Enter') saveTimeModal(); });
document.getElementById('timeModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeTimeModal(); });

async function saveTimeModal() {
  const mins = parseInt(document.getElementById('timeModalMins').value);
  const dateStr = document.getElementById('timeModalDate').value;
  if (!mins || mins < 1 || !dateStr || !timeModalTaskId) return;
  const addSecs = mins * 60;
  const ref = logsRef(dateStr);
  const snap = await ref.get();
  const existing = snap.exists ? (snap.data()[timeModalTaskId] || 0) : 0;
  await ref.set({ [timeModalTaskId]: existing + addSecs }, { merge: true });
  allLogs[dateStr] = { ...(allLogs[dateStr] || {}), [timeModalTaskId]: existing + addSecs };
  if (dateStr === todayStr()) todayLogs = allLogs[dateStr];
  closeTimeModal();
  renderGoals();
}

// ── TIMER ──
function toggleTimer(id) {
  if (runningId === id) { stopTimer(); return; }
  if (runningId) stopTimer();
  runningId = id;
  runningStart = Date.now();
  timerInterval = setInterval(() => { renderGoals(); updateTodayTotal(); }, 1000);
  renderGoals();
}
async function stopTimer() {
  if (!runningId) return;
  const elapsed = Math.round((Date.now() - runningStart) / 1000);
  const id = runningId;
  runningId = null; runningStart = null;
  clearInterval(timerInterval); timerInterval = null;
  if (elapsed > 0) {
    const ref = logsRef(todayStr());
    const snap = await ref.get();
    const existing = snap.exists ? (snap.data()[id] || 0) : 0;
    await ref.set({ [id]: existing + elapsed }, { merge: true });
  }
  renderGoals();
}

function getTodaySecs(id) {
  let s = todayLogs[id] || 0;
  if (runningId === id) s += Math.round((Date.now() - runningStart) / 1000);
  return s;
}
function getTodayTotal() {
  let total = Object.values(todayLogs).reduce((a,b) => a+b, 0);
  if (runningId) total += Math.round((Date.now() - runningStart) / 1000);
  return total;
}
function updateTodayTotal() {
  const s = getTodayTotal();
  document.getElementById('todayTotal').textContent = secsToMS(s);
}

// ── RENDER GOALS ──
function renderGoals() {
  updateTodayTotal();
  const list = document.getElementById('goalList');
  if (!tasks.length) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">🎯</div><div>목표를 추가해보세요!</div></div>';
    return;
  }
  list.innerHTML = tasks.map(t => {
    const color = getColor(t);
    const secs  = getTodaySecs(t.id);
    const isRun = runningId === t.id;
    return `
      <div class="goal-card">
        <div class="goal-color-bar" style="background:${color}"></div>
        <div class="goal-body">
          <div class="goal-info">
            <div class="goal-name">${escHtml(t.name)}</div>
            <div class="goal-time">${secsToMS(secs)}</div>
          </div>
          <div class="goal-actions">
            <button class="icon-btn" title="시간 추가" onclick="openTimeModal('${t.id}')">＋</button>
            <button class="icon-btn" title="수정" onclick="openEditModal('${t.id}')">✏️</button>
            <button class="icon-btn" title="삭제" onclick="deleteGoal('${t.id}')">🗑️</button>
            <button class="play-btn ${isRun ? 'running' : ''}"
              style="background:${color}; color:#fff;"
              onclick="toggleTimer('${t.id}')"
              title="${isRun ? '정지' : '재생'}">
              ${isRun ? '⏸' : '▶'}
            </button>
          </div>
        </div>
      </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── REPORT ──
function setPeriod(p) {
  reportPeriod = p; reportOffset = 0;
  document.getElementById('weekBtn').classList.toggle('active', p === 'week');
  document.getElementById('monthBtn').classList.toggle('active', p === 'month');
  renderReport();
}
function movePeriod(dir) { reportOffset += dir; renderReport(); }

function getPeriodDates() {
  const now = new Date();
  if (reportPeriod === 'week') {
    const day = now.getDay();
    const mon = new Date(now); mon.setDate(now.getDate() - day + 1 + reportOffset * 7);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    const dates = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(mon); d.setDate(mon.getDate() + i);
      dates.push(fmtDate(d));
    }
    return { dates, label: `${mon.getMonth()+1}/${mon.getDate()} – ${sun.getMonth()+1}/${sun.getDate()}`, days: 7 };
  } else {
    const base = new Date(now.getFullYear(), now.getMonth() + reportOffset, 1);
    const daysInMonth = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
    const dates = [];
    for (let i = 1; i <= daysInMonth; i++) {
      const d = new Date(base.getFullYear(), base.getMonth(), i);
      dates.push(fmtDate(d));
    }
    return { dates, label: `${base.getFullYear()}년 ${base.getMonth()+1}월`, days: daysInMonth };
  }
}

async function renderReport() {
  const { dates, label, days } = getPeriodDates();
  document.getElementById('periodLabel').textContent = label;

  // Ensure logs are subscribed
  dates.forEach(d => { if (!logUnsubMap[d]) subscribeLog(d); });

  // Gather data
  const taskTotals = {}; // taskId -> seconds
  let grandTotal = 0;
  const dateLabels = reportPeriod === 'week'
    ? dates.map(d => { const dd = new Date(d); return ['일','월','화','수','목','금','토'][dd.getDay()]; })
    : dates.map(d => new Date(d).getDate() + '일');

  const perDateTask = {}; // taskId -> [secPerDay]
  tasks.forEach(t => { taskTotals[t.id] = 0; perDateTask[t.id] = new Array(dates.length).fill(0); });

  dates.forEach((d, i) => {
    const log = allLogs[d] || {};
    Object.entries(log).forEach(([tid, s]) => {
      if (taskTotals[tid] !== undefined) { taskTotals[tid] += s; perDateTask[tid][i] += s; }
      grandTotal += s;
    });
  });

  document.getElementById('reportTotal').textContent = secsToHM(grandTotal);
  document.getElementById('reportAvg').textContent   = secsToHM(Math.round(grandTotal / days));

  // Chart
  const ctx = document.getElementById('reportChart').getContext('2d');
  const datasets = tasks.map(t => ({
    label: t.name,
    data: perDateTask[t.id].map(s => Math.round(s/60)),
    backgroundColor: getColor(t) + 'cc',
    borderRadius: 6, borderSkipped: false,
  }));

  if (reportChart) reportChart.destroy();
  reportChart = new Chart(ctx, {
    type: 'bar',
    data: { labels: dateLabels, datasets },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { font: { family: 'Nunito', size: 11 } } },
        y: { stacked: true, beginAtZero: true, ticks: { font: { family: 'Nunito', size: 11 } } }
      }
    }
  });

  // Breakdown
  const sorted = tasks.slice().sort((a,b) => (taskTotals[b.id]||0) - (taskTotals[a.id]||0));
  const maxSec = sorted[0] ? (taskTotals[sorted[0].id] || 1) : 1;
  document.getElementById('breakdownList').innerHTML = sorted.map(t => {
    const s = taskTotals[t.id] || 0;
    const pct = Math.round(s / (grandTotal || 1) * 100);
    const barW = Math.round(s / maxSec * 100);
    const color = getColor(t);
    return `
      <div class="breakdown-item">
        <div class="breakdown-top">
          <span class="breakdown-name" style="color:${color}">${escHtml(t.name)}</span>
          <span class="breakdown-time">${secsToHM(s)} (${pct}%)</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${barW}%;background:${color}"></div>
        </div>
      </div>`;
  }).join('');
}
